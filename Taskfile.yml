version: "3"

tasks:
  default:
    desc: Список доступных задач
    cmds:
      - task --list

  build:
    desc: Сборка бинарника приложения
    cmds:
      - go build -o bin/app ./cmd/app

  run:
    desc: Запуск сервера локально
    cmds:
      - go run ./cmd/app

  test:
    desc: Запуск всех тестов
    cmds:
      - go test ./...

  lint:
    desc: Линтинг кода
    cmds:
      - golangci-lint run
    silent: true

  fmt:
    desc: Форматирование кода
    cmds:
      - go fmt ./...

  clean:
    desc: Очистка бинарников
    cmds:
      - rm -rf bin

  txt:
    desc: Создать текстовый файл со всем содержимым проекта
    cmds:
      - find . -type f \( -name "*.go" -o -name "*.md" -o -name "*.yml" \) -exec echo "===== {} =====" \; -exec cat {} \; > project_snapshot.txt
